name: sdq-test
services:

  sdq-test-db:
    image: postgres:17
    container_name: sdq-test-db
    networks:
      - sdq-test
    environment:
      POSTGRES_USER: ${SDQ_TEST_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${SDQ_TEST_DATABASE_PASSWORD}
      POSTGRES_DB: ${SDQ_TEST_DATABASE_NAME}
    ports:
      - "5435:5432"
    volumes:
      - sdq_test_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U test -d sdq
      interval: 10s
      timeout: 3s
      retries: 3

  sdq-test-db-migration:
    build:
      context: ../${DB_MODULE}
    image: ${DB_MODULE}
    container_name: ${DB_MODULE}-test
    networks:
      - sdq-test
    environment:
      FLYWAY_URL: jdbc:postgresql://sdq-test-db:5432/${SDQ_TEST_DATABASE_NAME}
      FLYWAY_USER: ${SDQ_TEST_DATABASE_USERNAME}
      FLYWAY_PASSWORD: ${SDQ_TEST_DATABASE_PASSWORD}
    depends_on:
      sdq-test-db:
        condition: service_healthy
    command: migrate

networks:
  sdq-test:
    driver: bridge

volumes:
  sdq_test_data:
