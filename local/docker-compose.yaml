name: sdq
services:

  sdq-submission-api-go:
    build: 
      context: ..
      dockerfile: Dockerfile.golang
    image: ${SUBMISSION_API_MODULE_GO}
    container_name: ${SUBMISSION_API_MODULE_GO}
    networks:
      - sdq
    profiles:
      - api-go
    environment:
      DATABASE_URL: postgres://${SDQ_DATABASE_USERNAME}:${SDQ_DATABASE_PASSWORD}@${APPLICATION_NAME}-db:5432/${SDQ_DATABASE_NAME}?sslmode=disable
    ports:
      # Required when running the UI in dev mode on top of the service in docker
      - "8082:3000"
    depends_on:
      sdq-db-migration:
        condition: service_completed_successfully

  sdq-analysis-api-rust:
    build:
      context: ..
      dockerfile: Dockerfile.rust
    image: ${ANALYSIS_API_MODULE_RUST}
    container_name: ${ANALYSIS_API_MODULE_RUST}
    networks:
      - sdq
    profiles:
      - api-rust
    environment:
      SDQ_DATABASE_HOST: ${APPLICATION_NAME}-db:5432
      SDQ_DATABASE_NAME: ${SDQ_DATABASE_NAME}
      SDQ_DATABASE_USERNAME: ${SDQ_DATABASE_USERNAME}
      SDQ_DATABASE_PASSWORD: ${SDQ_DATABASE_PASSWORD}
    ports:
      # Required when running the UI in dev mode on top of the service in docker
      - "8081:3000"
    depends_on:
      sdq-db-migration:
        condition: service_completed_successfully

  sdq-analysis-api-java:
    build:
      context: ..
      dockerfile: Dockerfile.java
    image: ${ANALYSIS_API_MODULE_JAVA}
    container_name: ${ANALYSIS_API_MODULE_JAVA}
    networks:
      - sdq
    profiles:
      - api-java
    environment:
      SDQ_DATABASE_URL: jdbc:postgresql://${APPLICATION_NAME}-db:5432/${SDQ_DATABASE_NAME}
      SDQ_DATABASE_USERNAME: ${SDQ_DATABASE_USERNAME}
      SDQ_DATABASE_PASSWORD: ${SDQ_DATABASE_PASSWORD}
    ports:
      # Required when running the UI in dev mode on top of the service in docker
      - "8080:8080"
    depends_on:
      sdq-db-migration:
        condition: service_completed_successfully

  sdq-db-migration:
    build:
      context: ../${DB_MODULE}
    image: ${DB_MODULE}
    container_name: ${DB_MODULE}
    networks:
      - sdq
    environment:
      FLYWAY_URL: jdbc:postgresql://sdq-db:5432/${SDQ_DATABASE_NAME}
      FLYWAY_USER: ${SDQ_DATABASE_USERNAME}
      FLYWAY_PASSWORD: ${SDQ_DATABASE_PASSWORD}
    depends_on:
      sdq-db:
        condition: service_healthy
    command: migrate

  sdq-db:
    image: postgres:17
    container_name: sdq-db
    networks:
      - sdq
    environment:
      POSTGRES_USER: ${SDQ_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${SDQ_DATABASE_PASSWORD}
      POSTGRES_DB: ${SDQ_DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - sdq_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U ${SDQ_DATABASE_USERNAME} -d ${SDQ_DATABASE_NAME}
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  sdq:
    driver: bridge

volumes:
  sdq_data:
