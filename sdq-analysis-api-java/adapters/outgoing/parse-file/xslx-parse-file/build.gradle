plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version "${springDependencyVersion}"
}

group = 'uk.ratracejoe.sdq.xslx'
version = '0.0.1-SNAPSHOT'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    implementation project(":domain:ports:outgoing:parse-file")
    implementation project(":domain:ports:incoming:service")
    implementation project(":domain:model")
    implementation("org.slf4j:slf4j-api:2.0.16") // Service
    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'org.jxls:jxls-jexcel:1.0.9'
    implementation 'org.dhatim:fastexcel-reader:0.18.1'
    implementation 'org.dhatim:fastexcel:0.18.1'

    testImplementation project(":adapters:outgoing:repository:repository-sql-adapter")
    testImplementation project(":domain:ports:outgoing:repository")
    testImplementation("org.springframework.boot:spring-boot-starter-jdbc")
    testImplementation 'org.postgresql:postgresql:42.7.3'
    testImplementation project(":domain:use-cases")
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

test {
    useJUnitPlatform()
}
